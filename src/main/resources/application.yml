server:
  port: 9090

spring:
  application:
    name: ai-concierge-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_concierge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:RoySoft@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# LangChain4J Configuration
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:USE_YOUR_OWN_KEY}
      model-name: gpt-4o-mini
      temperature: 0.7
      max-tokens: 2048
      log-requests: true
      log-responses: false
    embedding-model:
      api-key: ${OPENAI_API_KEY:USE_YOUR_OWN_KEY}
      model-name: text-embedding-3-small

# Weaviate Configuration
app:
  weaviate:
    scheme: http
    host: localhost:8081
    class-name: HotelDocumentChunk
    top-k: 5

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YWktY29uY2llcmdlLXNlcnZpY2Utc2VjcmV0LWtleS1mb3ItaG90ZWwtcGxhdGZvcm0tMjAyNA==}
  expiration-ms: 86400000
  qr-expiration-ms: 604800000

# QR Code Configuration
qr:
  base-url: ${QR_BASE_URL:http://localhost:9090}
  width: 300
  height: 300

# Twilio WhatsApp Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:USE_YOUR_OWN_SID}
  auth-token: ${TWILIO_AUTH_TOKEN:USE_YOUR_OWN_TOKEN}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:+14155238886}

# Rate Limiting
rate-limit:
  requests-per-minute: 60
  burst-capacity: 10

# Logging
logging:
  level:
    com.hotel.concierge: DEBUG
    dev.langchain4j: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
