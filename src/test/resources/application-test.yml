spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

langchain4j:
  open-ai:
    chat-model:
      api-key: test-key
      model-name: gpt-4o
    embedding-model:
      api-key: test-key
      model-name: text-embedding-3-small

jwt:
  secret: YWktY29uY2llcmdlLXNlcnZpY2Utc2VjcmV0LWtleS1mb3ItaG90ZWwtcGxhdGZvcm0tMjAyNA==
  expiration-ms: 86400000
  qr-expiration-ms: 604800000

weaviate:
  host: localhost
  port: 8081
  scheme: http
  api-key: ""

qr:
  base-url: http://localhost:8080
  width: 300
  height: 300

rate-limit:
  requests-per-minute: 1000
  burst-capacity: 100
